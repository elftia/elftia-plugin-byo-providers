name: Refresh reproducibility manifest (Linux-canonical)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh verification/reproducibility.json on Linux
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run check:reproducible -- --update
          npm run check:reproducible
      - name: Commit the refreshed manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- verification/reproducibility.json; then
            echo "manifest unchanged"
            exit 0
          fi
          git config user.name "elftia-release-bot"
          git config user.email "bot@elftia.com"
          git add verification/reproducibility.json
          git commit -m "chore(repro): refresh manifest with Linux-canonical bytes"
          git push
